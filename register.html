<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
</head>
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }
    body{
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    width: 100%;
    }
    .register{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
    }
    .box2{
        height: 50%;
        width: 40%;
        border: 1px solid;
        background-color: white;
        box-shadow: 10px 10px #ffffff;
         border-radius: 10px;
    }
</style>
<body>
    <div class="register">
        <div  class="box2">
            <div style="padding: 10px;margin-left: 150px;">
                <h2 >Create Account</h2>
            <p style="margin:15px ;">Join a Username</p>
            </div>
            <div style="margin-left: 50px;">
                <h4>Choose a username</h4>
                <input id="name" style="height: 30px;width: 400px;border-radius: 10px;border:1px solid gray" type="text">
            </div>
            <div style="margin-left: 50px;margin-top: 20px;">
                <h4>Password</h4>
                <input id="password" style="height: 30px;width: 400px;border-radius: 10px;border:1px solid gray" type="text">
            </div>
            <div style="margin-left: 50px;margin-top: 30px;" >
                <button style="height: 30px;width: 400px;border-radius: 10px;border: none;background-color: green;">Register</button>
            </div>
             <div style="display: flex;margin-left: 150px; gap: 10px;margin-top: 10px;">
            <p>Already have an accont?</p>
            <a style="color: green;" href="login.html">login here</a>
        </div>

        </div>
    </div>
    <script src="registration.js"></script>
</body>
</html>
