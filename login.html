<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn Account</title>
</head>
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }
    body{
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    width: 100%;
    }
    .login{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        width: 100%;
        background-color: rgb(250, 249, 249);
       
    }
    .box{
        height: 50%;
        width: 40%;
        border: 1px solid;
        background-color: white;
        box-shadow: 10px 10px #ffffff;
         border-radius: 10px;


    }
</style>
<body>
   <div class="login">
    <div class="box">
        <h2 style="padding: 10px;margin-left: 150px;">Welcome Back</h2>
        <p style="padding: 10px;margin-left: 158px;">Login to finTrack Pro</p>


        <h6 style="margin-left: 55px;font-size: medium;font-weight: 500;">Username</h6>
            
        <div style="height:35px;width: 400px;border: 1px solid;margin-left: 55px;border-radius: 10px;">
            <img style="height: 20px;margin-top: 5px;" src="user-fill.png" alt="">
            <input style="height: 25px;width: 350px;border: none;text-align: ;" type="text" placeholder="Enter your Username">
        </div>
        <h6 style="margin-left: 55px;margin-top: 30px;font-size: medium;font-weight: 500;">Password</h6>
        <div style="height: 35px;width: 400px;border: 1px solid;margin-left: 55px;display: flex;justify-content: space-between;border-radius: 10px;">
            <img style="height: 20px;margin-top: 5px;" src="lock-fill.png" alt="">
            <input style="height: 25px;width: 350px;border: none;" type="encryption" placeholder="Enter Your Password">
            <img style="height: 20px;margin-top: 5px;" src="eye-close-line.png" alt="">
        </div>
        <div>
            <button style="height:35px;width: 400px;border: 1px solid;margin-left: 55px;margin-top: 30px;border-radius: 10px;background-color: blue;color: white;">Login</button>
        </div>

        <div style="display: flex;margin-left: 150px; gap: 10px;margin-top: 5px;">
            <p>Don't have an accont?</p>
            <a style="color: navy;" href="register.html">Regiser Here</a>
        </div>
    </div>
   </div> 
</body>
</html>
